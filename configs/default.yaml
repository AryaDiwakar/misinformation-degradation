data:
  root: "./data/upfd/raw"
  subset: "gossipcop"
  feature_type: "bert"
  batch_size: 64

model:
  name: "hybrid"
  input_dim: 768
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  bidirectional: true

training:
  seed: 1
  epochs: 20
  lr: 0.001
  weight_decay: 1e-5
  early_stop_patience: 10
  drift_weight: 0.5
  truncations: [0.1, 0.25, 0.5, 0.75, 1.0]

logging:
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  result_dir: "./results"
