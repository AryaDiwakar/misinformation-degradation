name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install numpy scipy scikit-learn pyyaml pytest tensorboard torch torch-geometric statsmodels
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            pipeline data features models scripts tests demo \
            train.py evaluate.py predict.py multiseed.py \
            run_experiments.py run_final.py run_gossipcop.py train_trajectory.py
      - name: Run tests
        run: python -m pytest -q
